name: Windows tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  fast:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run fast tests
        shell: powershell
        run: ./tools/Run-Tests.ps1 -Suite fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-test-results
          path: output/test-results

  headless-integration:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Run headless integration tests
        shell: powershell
        run: ./tools/Run-Tests.ps1 -Suite headless-integration -DisallowSkips
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-test-results
          path: output/test-results
